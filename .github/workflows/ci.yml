name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Railway production security checks
        env:
          DJANGO_SECRET_KEY: ci-blog-test-secret-1234567890-ABCDEFGHIJKLMNOPQRSTUVWXYZ-2026
          DJANGO_DEBUG: "false"
          AGENT_SECURITY_ENFORCED: "true"
          DJANGO_HTTPS_TERMINATED: "true"
          RAILWAY_ENVIRONMENT_NAME: ci
          RAILWAY_PUBLIC_DOMAIN: blog-ci.up.railway.app
          DATABASE_URL: postgres://ci_user:ci-only-password@127.0.0.1:5432/ci_check
          REDIS_URL: redis://127.0.0.1:6379/0
          REDIS_CACHE_URL: redis://127.0.0.1:6379/1
          RABBITMQ_URL: amqp://ci_user:ci-only-password@127.0.0.1:5672/ci_check
          BLOG_MEDIA_STORAGE: file
          OPENAI_API_KEY: ""
          OPENAI_EMBEDDING_API_KEY: ""
          BAILIAN_API_KEY: ""
          DASHSCOPE_API_KEY: ""
        run: python manage.py check --deploy

      - name: Run tests
        env:
          BLOG_LOCAL_MODE: "true"
          DJANGO_SECRET_KEY: ci-blog-test-secret-1234567890-ABCDEFGHIJKLMNOPQRSTUVWXYZ-2026
          DJANGO_DEBUG: "false"
          AGENT_SECURITY_ENFORCED: "false"
          OPENAI_API_KEY: ""
          OPENAI_EMBEDDING_API_KEY: ""
          BAILIAN_API_KEY: ""
          DASHSCOPE_API_KEY: ""
          LANGSMITH_TRACING: "false"
          LANGCHAIN_TRACING_V2: "false"
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py test apps.agent_api apps.core

      - name: Run full security-enforced suite (isolated SQLite)
        env:
          DJANGO_SETTINGS_MODULE: config.settings_security_test
          DJANGO_SECRET_KEY: ci-only-blog-security-test-key-not-production-2026-0123456789abcdefghijklmnopqrstuvwxyz
          BLOG_LOCAL_MODE: "false"
          AGENT_SECURITY_ENFORCED: "true"
          DJANGO_HTTPS_TERMINATED: "true"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          BLOG_MEDIA_STORAGE: file
          OPENAI_API_KEY: ""
          OPENAI_EMBEDDING_API_KEY: ""
          BAILIAN_API_KEY: ""
          DASHSCOPE_API_KEY: ""
          LANGSMITH_TRACING: "false"
          LANGCHAIN_TRACING_V2: "false"
        run: |
          python manage.py test apps.agent_api apps.core

  backend-postgres:
    name: PostgreSQL 16 + pgvector integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: blog_pgvector_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_pgvector_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings_postgres_test
      BLOG_PGVECTOR_INTEGRATION: "1"
      BLOG_LOCAL_MODE: "false"
      AGENT_SECURITY_ENFORCED: "true"
      BLOG_MEDIA_STORAGE: file
      RAG_VECTOR_BACKEND: pgvector
      AGENT_FORCE_LOCAL_EMBEDDINGS: "true"
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/blog_pgvector_ci
      DJANGO_SECRET_KEY: ci-only-pgvector-integration-secret-not-production-0123456789
      OPENAI_API_KEY: ""
      OPENAI_EMBEDDING_API_KEY: ""
      BAILIAN_API_KEY: ""
      DASHSCOPE_API_KEY: ""
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations to fresh PostgreSQL service database
        run: python manage.py migrate --noinput --verbosity 2

      - name: Run real PostgreSQL and pgvector tests
        run: python manage.py test postgres_integration --verbosity 2

      - name: Collect PostgreSQL service logs on failure
        if: failure()
        working-directory: .
        run: |
          docker ps -a --filter "ancestor=pgvector/pgvector:0.8.6-pg16" --format '{{.ID}}' | while read -r container_id; do
            docker logs "$container_id" > postgres-service.log 2>&1
            cat postgres-service.log
          done

      - name: Upload PostgreSQL failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-pgvector-failure-logs
          path: postgres-service.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend unit tests, type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 24 runs the existing node --test TypeScript test files directly.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build:check -- --logLevel error

  screenshot-tray:
    name: Windows screenshot tray offline tests
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: tools/screenshot-tray/requirements.txt

      - name: Install screenshot tray dependencies
        run: python -m pip install -r tools/screenshot-tray/requirements.txt

      - name: Run screenshot tray offline tests
        shell: pwsh
        run: |
          python -m unittest discover -s tools/screenshot-tray/tests -v 2>&1 | Tee-Object -FilePath screenshot-tray-tests.log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - name: Keep screenshot test failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-tray-offline-failure
          path: screenshot-tray-tests.log
          if-no-files-found: ignore
          retention-days: 7

  upload-e2e:
    name: Chromium upload and draft E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser upload and draft tests
        working-directory: frontend
        env:
          E2E_PYTHON: python
          CI: "true"
        run: npm run test:e2e

      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-browser-e2e-failure
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          docker compose config
          docker compose build frontend backend

  ci-evidence:
    name: CI evidence summary
    if: always()
    needs: [backend, backend-postgres, frontend, screenshot-tray, upload-e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Write result for this exact commit
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          POSTGRES_RESULT: ${{ needs['backend-postgres'].result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SCREENSHOT_RESULT: ${{ needs['screenshot-tray'].result }}
          E2E_RESULT: ${{ needs['upload-e2e'].result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          {
            echo '# Blog V2 CI evidence'
            echo
            echo "Commit: \`${GITHUB_SHA}\` · Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo "| Backend default + security suite | ${BACKEND_RESULT} |"
            echo "| Real PostgreSQL/pgvector integration | ${POSTGRES_RESULT} |"
            echo "| Frontend unit tests + type check + production build | ${FRONTEND_RESULT} |"
            echo "| Windows screenshot tray offline tests | ${SCREENSHOT_RESULT} |"
            echo "| Chromium browser E2E | ${E2E_RESULT} |"
            echo "| Compose configuration + image build | ${DOCKER_RESULT} |"
            echo
            echo 'This records CI gate results for the linked commit. It does not certify Railway deployment, independent worker failures, human evaluation labels, or real-user performance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the summary gate red when a required job fails
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
