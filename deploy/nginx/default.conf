# Accept the TLS signal only from the host proxy on the loopback-published
# listener. A direct HTTP request without that exact value stays HTTP and is
# redirected by Django. The host proxy must replace, not append, this header.
map $http_x_forwarded_proto $backend_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # The chat endpoint returns SSE frames before the answer is complete.
    location = /api/agent/chat/stream/ {
        proxy_pass http://backend:8000/api/agent/chat/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 180s;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_forwarded_proto;
        proxy_read_timeout 180s;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_forwarded_proto;
    }

    # Block legacy private-note files before the general public media alias.
    location = /media/private-notes { return 404; }
    location ^~ /media/private-notes/ { return 404; }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Public Vite OCR resources must not fall back to index.html on a miss.
    # The manifest and model files are generated together at build time.
    location ^~ /models/ocr/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /ort/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Editor typesetting assets (lute/katex/mermaid/highlight), generated at
    # build time by frontend/scripts/sync-editor-assets.mjs. Missing files must
    # 404 instead of falling back to index.html.
    location ^~ /vendor/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location ~ ^/(?:robots\.txt|sitemap\.xml)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $backend_forwarded_proto;
    }

    # Only public article-shaped paths need Django's current publication state
    # and share metadata. Collection/settings routes remain in the static SPA.
    location ~ ^/blog/(?!collections(?:/|$)|settings(?:/|$))[^/]+/?$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $backend_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
