services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: knowledge-agent-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: knowledge-agent-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-knowledge_agent}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-blog}:${RABBITMQ_PASSWORD:-blog}@rabbitmq:5672/${RABBITMQ_VHOST:-blog}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      AGENT_SECURITY_ENFORCED: ${AGENT_SECURITY_ENFORCED:-true}
      RAG_VECTOR_BACKEND: ${RAG_VECTOR_BACKEND:-pgvector}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - media_data:/app/backend/media
      - static_data:/app/backend/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: knowledge-agent-celery-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-knowledge_agent}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-blog}:${RABBITMQ_PASSWORD:-blog}@rabbitmq:5672/${RABBITMQ_VHOST:-blog}
      RAG_VECTOR_BACKEND: ${RAG_VECTOR_BACKEND:-pgvector}
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--queues=celery,documents"]
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media_data:/app/backend/media
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: knowledge-agent-celery-beat
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-knowledge_agent}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-blog}:${RABBITMQ_PASSWORD:-blog}@rabbitmq:5672/${RABBITMQ_VHOST:-blog}
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-knowledge_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: knowledge-agent-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: knowledge-agent-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-blog}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-blog}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-blog}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  media_data:
  static_data:
