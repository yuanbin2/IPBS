<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge Agent Platform</title>
    <meta name="description" content="企业知识智能体平台 - 桌面应用" />
    <style>
      /* Prevent flash of unstyled content */
      html, body {
        margin: 0;
        padding: 0;
        background: #17262e;
        overflow: hidden;
      }

      #app {
        height: 100vh;
        width: 100vw;
      }

      /* Loading state */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #17262e;
        color: #a9bfc8;
        font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }

      .app-loading-content {
        text-align: center;
      }

      .app-loading-logo {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        background: #276678;
        color: #ffffff;
        font-size: 28px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
      }

      .app-loading-text {
        font-size: 14px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Loading state shown while Vue initializes -->
      <div class="app-loading">
        <div class="app-loading-content">
          <div class="app-loading-logo">K</div>
          <div class="app-loading-text">Loading Knowledge Agent...</div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
